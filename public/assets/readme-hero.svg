<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;family=Space+Mono:wght@700&amp;family=Permanent+Marker&amp;display=swap');
      
      .brand-title { font-family: 'Permanent Marker', cursive; font-size: 88px; fill: #000000; }
      .brand-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 900; fill: #000000; letter-spacing: -0.5px; }
      .tagline { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; fill: #000000; opacity: 0.85; }
      .badge-text { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; fill: #000000; }
      
      /* Equalizer Bar Animations */
      @keyframes eq1 { 0%, 100% { height: 18px; y: 41px; } 50% { height: 50px; y: 9px; } }
      @keyframes eq2 { 0%, 100% { height: 45px; y: 14px; } 50% { height: 20px; y: 39px; } }
      @keyframes eq3 { 0%, 100% { height: 25px; y: 34px; } 50% { height: 56px; y: 3px; } }
      @keyframes eq4 { 0%, 100% { height: 52px; y: 7px; } 50% { height: 22px; y: 37px; } }
      @keyframes eq5 { 0%, 100% { height: 30px; y: 29px; } 50% { height: 48px; y: 11px; } }
      
      .bar-1 { animation: eq1 1.1s ease-in-out infinite; }
      .bar-2 { animation: eq2 0.9s ease-in-out infinite; }
      .bar-3 { animation: eq3 1.3s ease-in-out infinite; }
      .bar-4 { animation: eq4 1.0s ease-in-out infinite; }
      .bar-5 { animation: eq5 1.2s ease-in-out infinite; }

      /* Pulse Ring Animation */
      @keyframes pulseRing {
        0% { transform: scale(0.95); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 0.4; }
        100% { transform: scale(0.95); opacity: 0.9; }
      }
      .pulsing-dot { animation: pulseRing 2s infinite ease-in-out; transform-origin: center; }
      
      /* Floating Point Cards Float Animation */
      @keyframes floatUp {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .floating-card-1 { animation: floatUp 3.2s ease-in-out infinite; }
      .floating-card-2 { animation: floatUp 3.8s ease-in-out infinite 0.5s; }
      .floating-card-3 { animation: floatUp 3.4s ease-in-out infinite 1.0s; }
    </style>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#000000" stroke-width="1" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="520" fill="#f8fafc" />
  <rect width="1200" height="520" fill="url(#grid)" />

  <!-- Outer Hard Shadow -->
  <rect x="24" y="24" width="1152" height="472" fill="#000000" />
  
  <!-- Outer Main Window Frame -->
  <rect x="12" y="12" width="1152" height="472" fill="#ffffff" stroke="#000000" stroke-width="4" />
  
  <!-- Top Neobrutalist Title Bar -->
  <rect x="12" y="12" width="1152" height="48" fill="#facc15" stroke="#000000" stroke-width="4" />
  
  <!-- Window Control Buttons -->
  <circle cx="42" cy="36" r="8" fill="#ff66a3" stroke="#000000" stroke-width="2.5" />
  <circle cx="66" cy="36" r="8" fill="#1ac2ff" stroke="#000000" stroke-width="2.5" />
  <circle cx="90" cy="36" r="8" fill="#4ade80" stroke="#000000" stroke-width="2.5" />
  
  <text x="120" y="41" font-family="'Space Mono', monospace" font-size="14" font-weight="700" fill="#000000">TALLI // AMBIENT CLASSROOM INTELLIGENCE ENGINE (CYPRUS PRIMARY EDUCATION)</text>

  <!-- Live Status Pill (Top Right) -->
  <g transform="translate(930, 22)">
    <rect x="3" y="3" width="210" height="28" fill="#000000" />
    <rect x="0" y="0" width="210" height="28" fill="#4ade80" stroke="#000000" stroke-width="2.5" />
    <circle cx="18" cy="14" r="6" fill="#000000" class="pulsing-dot" />
    <circle cx="18" cy="14" r="4" fill="#ffffff" />
    <text x="34" y="19" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#000000">DEEPGRAM STT : LIVE</text>
  </g>

  <!-- Left Main Content Area -->
  <g transform="translate(60, 95)">
    <!-- Main Logo Shadow & Text -->
    <text x="4" y="94" class="brand-title" opacity="0.15">Talli</text>
    <text x="0" y="90" class="brand-title">Talli</text>
    
    <rect x="0" y="115" width="620" height="42" fill="#ff66a3" stroke="#000000" stroke-width="3" />
    <text x="16" y="142" class="brand-sub">AMBIENT GREEK CLASSROOM BEHAVIOR COPILOT</text>
    
    <text x="0" y="190" class="tagline">Passive Voice Recognition • Greek Vocative Declension Engine</text>
    <text x="0" y="212" class="tagline">Single-Pass Multi-Student Passing • Automated Roster Analytics</text>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(0, 240)">
      <!-- Badge 1: Cyprus Primary System -->
      <g transform="translate(0, 0)">
        <rect x="3" y="3" width="160" height="34" fill="#000000" />
        <rect x="0" y="0" width="160" height="34" fill="#1ac2ff" stroke="#000000" stroke-width="2.5" />
        <text x="14" y="22" class="badge-text">Cyprus Grades A'-ST'</text>
      </g>

      <!-- Badge 2: Deepgram Nova-2 -->
      <g transform="translate(175, 0)">
        <rect x="3" y="3" width="150" height="34" fill="#000000" />
        <rect x="0" y="0" width="150" height="34" fill="#facc15" stroke="#000000" stroke-width="2.5" />
        <text x="14" y="22" class="badge-text">Deepgram Nova-2</text>
      </g>

      <!-- Badge 3: Silero VAD -->
      <g transform="translate(340, 0)">
        <rect x="3" y="3" width="130" height="34" fill="#000000" />
        <rect x="0" y="0" width="130" height="34" fill="#c084fc" stroke="#000000" stroke-width="2.5" />
        <text x="14" y="22" class="badge-text">Silero WASM VAD</text>
      </g>

      <!-- Badge 4: Next.js 14 -->
      <g transform="translate(485, 0)">
        <rect x="3" y="3" width="115" height="34" fill="#000000" />
        <rect x="0" y="0" width="115" height="34" fill="#4ade80" stroke="#000000" stroke-width="2.5" />
        <text x="14" y="22" class="badge-text">Next.js 14</text>
      </g>
    </g>

    <!-- Spoken Greek Example Ribbon -->
    <g transform="translate(0, 305)">
      <rect x="4" y="4" width="600" height="48" fill="#000000" />
      <rect x="0" y="0" width="600" height="48" fill="#ffffff" stroke="#000000" stroke-width="3" />
      <rect x="0" y="0" width="12" height="48" fill="#ff66a3" />
      <text x="24" y="29" font-family="'Space Mono', monospace" font-size="13" font-weight="700" fill="#000000">
        "Μπράβο Ελένη, πολύ ωραία Γιάννη!"
      </text>
      <rect x="470" y="10" width="115" height="28" fill="#4ade80" stroke="#000000" stroke-width="2" />
      <text x="480" y="28" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#000000">+1 PTS EACH</text>
    </g>
  </g>

  <!-- Right Visual Graphics Container -->
  <g transform="translate(730, 95)">
    
    <!-- Audio Equalizer Monitor Window -->
    <g transform="translate(0, 0)">
      <rect x="6" y="6" width="400" height="150" fill="#000000" />
      <rect x="0" y="0" width="400" height="150" fill="#1ac2ff" stroke="#000000" stroke-width="3.5" />
      
      <!-- Equalizer Window Title -->
      <rect x="0" y="0" width="400" height="30" fill="#ffffff" stroke="#000000" stroke-width="3.5" />
      <text x="12" y="20" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#000000">AUDIO SPECTRUM // 4.8s BUFFER</text>
      
      <!-- Animated Waveform Equalizer Bars -->
      <g transform="translate(40, 55)">
        <rect x="0" y="20" width="14" height="30" fill="#000000" class="bar-1" />
        <rect x="24" y="10" width="14" height="45" fill="#000000" class="bar-2" />
        <rect x="48" y="25" width="14" height="25" fill="#000000" class="bar-3" />
        <rect x="72" y="5" width="14" height="55" fill="#000000" class="bar-4" />
        <rect x="96" y="18" width="14" height="35" fill="#000000" class="bar-5" />
        <rect x="120" y="12" width="14" height="42" fill="#000000" class="bar-2" />
        <rect x="144" y="28" width="14" height="20" fill="#000000" class="bar-1" />
        <rect x="168" y="8" width="14" height="50" fill="#000000" class="bar-4" />
        <rect x="192" y="22" width="14" height="32" fill="#000000" class="bar-3" />
        <rect x="216" y="14" width="14" height="44" fill="#000000" class="bar-5" />
        <rect x="240" y="30" width="14" height="18" fill="#000000" class="bar-1" />
        <rect x="264" y="6" width="14" height="54" fill="#000000" class="bar-4" />
        <rect x="288" y="16" width="14" height="38" fill="#000000" class="bar-2" />
        <rect x="312" y="24" width="14" height="26" fill="#000000" class="bar-3" />
      </g>
    </g>

    <!-- Floating Live Event Cards -->
    <g transform="translate(0, 175)">
      
      <!-- Event Card 1: Eleni M. Praise -->
      <g class="floating-card-1" transform="translate(0, 0)">
        <rect x="5" y="5" width="390" height="56" fill="#000000" />
        <rect x="0" y="0" width="390" height="56" fill="#4ade80" stroke="#000000" stroke-width="3" />
        <rect x="12" y="12" width="32" height="32" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="22" y="33" font-family="'Space Mono', monospace" font-size="14" font-weight="700" fill="#000000">EM</text>
        <text x="56" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#000000">Eleni M. (Ελένη Μ.)</text>
        <text x="56" y="44" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#000000">Praise: "Μπράβο Ελένη"</text>
        
        <rect x="305" y="12" width="70" height="32" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="317" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#000000">+1 PTS</text>
      </g>

      <!-- Event Card 2: Yiannis P. Praise -->
      <g class="floating-card-2" transform="translate(10, 70)">
        <rect x="5" y="5" width="380" height="56" fill="#000000" />
        <rect x="0" y="0" width="380" height="56" fill="#facc15" stroke="#000000" stroke-width="3" />
        <rect x="12" y="12" width="32" height="32" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="22" y="33" font-family="'Space Mono', monospace" font-size="14" font-weight="700" fill="#000000">YP</text>
        <text x="56" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#000000">Yiannis P. (Γιάννης Π.)</text>
        <text x="56" y="44" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#000000">Praise: "Πολύ ωραία Γιάννη"</text>
        
        <rect x="295" y="12" width="70" height="32" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="307" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#000000">+1 PTS</text>
      </g>

      <!-- Event Card 3: Nikos L. Correction -->
      <g class="floating-card-3" transform="translate(20, 140)">
        <rect x="5" y="5" width="370" height="56" fill="#000000" />
        <rect x="0" y="0" width="370" height="56" fill="#ff66a3" stroke="#000000" stroke-width="3" />
        <rect x="12" y="12" width="32" height="32" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="22" y="33" font-family="'Space Mono', monospace" font-size="14" font-weight="700" fill="#000000">NL</text>
        <text x="56" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#000000">Nikos L. (Νίκος Λ.)</text>
        <text x="56" y="44" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#000000">Correction: "Σταμάτα Νίκο"</text>
        
        <rect x="285" y="12" width="70" height="32" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="298" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#000000">-1 PTS</text>
      </g>

    </g>
  </g>
</svg>
