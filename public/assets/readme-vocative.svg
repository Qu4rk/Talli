<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;family=Space+Mono:wght@700&amp;display=swap');
      
      .col-header { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 11px; font-weight: 700; fill: #000000; letter-spacing: 0.5px; }
      .box-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 900; fill: #000000; }
      .box-sub { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 10px; font-weight: 700; fill: #000000; opacity: 0.85; }
      .arrow-label { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 9px; font-weight: 700; fill: #000000; text-anchor: middle; }

      @keyframes pulseArrow {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(4px); }
      }
      .moving-arrow { animation: pulseArrow 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Shadow Layer -->
  <rect x="16" y="16" width="968" height="348" fill="#000000" />
  
  <!-- Outer Window Frame -->
  <rect x="4" y="4" width="968" height="348" fill="#ffffff" stroke="#000000" stroke-width="4" />
  
  <!-- Top Bar -->
  <rect x="4" y="4" width="968" height="42" fill="#c084fc" stroke="#000000" stroke-width="4" />
  <text x="20" y="27" font-family="'Space Mono', 'SF Mono', monospace" font-size="13" font-weight="700" fill="#000000">ENGINE // GREEK VOCATIVE DECLENSION &amp; MULTI-STUDENT PARSER</text>

  <g transform="translate(30, 65)">
    
    <!-- Column Headers Row -->
    <g transform="translate(0, 0)">
      <!-- Col 1 Header -->
      <rect x="0" y="0" width="200" height="24" fill="#1ac2ff" stroke="#000000" stroke-width="2" />
      <text x="100" y="16" class="col-header" text-anchor="middle">1. OFFICIAL ROSTER</text>

      <!-- Col 2 Header -->
      <rect x="275" y="0" width="200" height="24" fill="#facc15" stroke="#000000" stroke-width="2" />
      <text x="375" y="16" class="col-header" text-anchor="middle">2. SPOKEN VOCATIVE</text>

      <!-- Col 3 Header -->
      <rect x="550" y="0" width="390" height="24" fill="#4ade80" stroke="#000000" stroke-width="2" />
      <text x="745" y="16" class="col-header" text-anchor="middle">3. AUTOMATED POINT DISPATCH</text>
    </g>

    <!-- Content Rows Area -->
    <g transform="translate(0, 38)">
      
      <!-- Row 1: Yiannis -->
      <g transform="translate(0, 0)">
        <!-- Col 1 Box -->
        <g transform="translate(0, 0)">
          <rect x="4" y="4" width="200" height="64" fill="#000000" />
          <rect x="0" y="0" width="200" height="64" fill="#ffffff" stroke="#000000" stroke-width="3" />
          <text x="14" y="26" class="box-title">Γιάννης (Nominative)</text>
          <text x="14" y="46" class="box-sub">Roster Record #2</text>
        </g>

        <!-- Arrow Connector 1 -->
        <g transform="translate(210, 16)" class="moving-arrow">
          <text x="28" y="-3" class="arrow-label">declension</text>
          <path d="M 5 15 L 50 15 M 42 7 L 50 15 L 42 23" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </g>

        <!-- Col 2 Box -->
        <g transform="translate(275, 0)">
          <rect x="4" y="4" width="200" height="64" fill="#000000" />
          <rect x="0" y="0" width="200" height="64" fill="#ffffff" stroke="#000000" stroke-width="3" />
          <text x="14" y="26" class="box-title">"Γιάννη!" (Vocative)</text>
          <text x="14" y="46" class="box-sub">Teacher Dialogue</text>
        </g>

        <!-- Arrow Connector 2 -->
        <g transform="translate(485, 16)" class="moving-arrow">
          <text x="28" y="-3" class="arrow-label">match</text>
          <path d="M 5 15 L 50 15 M 42 7 L 50 15 L 42 23" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </g>

        <!-- Col 3 Box -->
        <g transform="translate(550, 0)">
          <rect x="4" y="4" width="390" height="64" fill="#000000" />
          <rect x="0" y="0" width="390" height="64" fill="#4ade80" stroke="#000000" stroke-width="3" />
          <text x="14" y="26" class="box-title">RESOLVED: Yiannis P. (ID #2)</text>
          <text x="14" y="46" class="box-sub">Praise Trigger: "Πολύ ωραία" -&gt; +1 PTS</text>
        </g>
      </g>

      <!-- Row 2: Andreas -->
      <g transform="translate(0, 84)">
        <g transform="translate(0, 0)">
          <rect x="4" y="4" width="200" height="64" fill="#000000" />
          <rect x="0" y="0" width="200" height="64" fill="#ffffff" stroke="#000000" stroke-width="3" />
          <text x="14" y="26" class="box-title">Ανδρέας (Nominative)</text>
          <text x="14" y="46" class="box-sub">Roster Record #4</text>
        </g>

        <g transform="translate(210, 16)" class="moving-arrow">
          <text x="28" y="-3" class="arrow-label">declension</text>
          <path d="M 5 15 L 50 15 M 42 7 L 50 15 L 42 23" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </g>

        <g transform="translate(275, 0)">
          <rect x="4" y="4" width="200" height="64" fill="#000000" />
          <rect x="0" y="0" width="200" height="64" fill="#ffffff" stroke="#000000" stroke-width="3" />
          <text x="14" y="26" class="box-title">"Ανδρέα!" (Vocative)</text>
          <text x="14" y="46" class="box-sub">Teacher Dialogue</text>
        </g>

        <g transform="translate(485, 16)" class="moving-arrow">
          <text x="28" y="-3" class="arrow-label">match</text>
          <path d="M 5 15 L 50 15 M 42 7 L 50 15 L 42 23" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </g>

        <g transform="translate(550, 0)">
          <rect x="4" y="4" width="390" height="64" fill="#000000" />
          <rect x="0" y="0" width="390" height="64" fill="#4ade80" stroke="#000000" stroke-width="3" />
          <text x="14" y="26" class="box-title">RESOLVED: Andreas T. (ID #4)</text>
          <text x="14" y="46" class="box-sub">Praise Trigger: "Μπράβο" -&gt; +1 PTS</text>
        </g>
      </g>

      <!-- Row 3: Nikos -->
      <g transform="translate(0, 168)">
        <g transform="translate(0, 0)">
          <rect x="4" y="4" width="200" height="64" fill="#000000" />
          <rect x="0" y="0" width="200" height="64" fill="#ffffff" stroke="#000000" stroke-width="3" />
          <text x="14" y="26" class="box-title">Νίκος (Nominative)</text>
          <text x="14" y="46" class="box-sub">Roster Record #6</text>
        </g>

        <g transform="translate(210, 16)" class="moving-arrow">
          <text x="28" y="-3" class="arrow-label">declension</text>
          <path d="M 5 15 L 50 15 M 42 7 L 50 15 L 42 23" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </g>

        <g transform="translate(275, 0)">
          <rect x="4" y="4" width="200" height="64" fill="#000000" />
          <rect x="0" y="0" width="200" height="64" fill="#ffffff" stroke="#000000" stroke-width="3" />
          <text x="14" y="26" class="box-title">"Νίκο!" (Vocative)</text>
          <text x="14" y="46" class="box-sub">Teacher Dialogue</text>
        </g>

        <g transform="translate(485, 16)" class="moving-arrow">
          <text x="28" y="-3" class="arrow-label">match</text>
          <path d="M 5 15 L 50 15 M 42 7 L 50 15 L 42 23" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </g>

        <g transform="translate(550, 0)">
          <rect x="4" y="4" width="390" height="64" fill="#000000" />
          <rect x="0" y="0" width="390" height="64" fill="#ff66a3" stroke="#000000" stroke-width="3" />
          <text x="14" y="26" class="box-title">RESOLVED: Nikos L. (ID #6)</text>
          <text x="14" y="46" class="box-sub">Correction Trigger: "Σταμάτα" -&gt; -1 PTS</text>
        </g>
      </g>

    </g>
  </g>
</svg>
