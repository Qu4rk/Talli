<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;family=Space+Mono:wght@700&amp;display=swap');
      
      .box-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 900; fill: #000000; }
      .box-sub { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 10px; font-weight: 700; fill: #000000; opacity: 0.85; }
      .arrow-label { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 9px; font-weight: 700; fill: #000000; }

      @keyframes pulseArrow {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(5px); }
      }
      .moving-arrow { animation: pulseArrow 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Shadow Layer -->
  <rect x="16" y="16" width="968" height="348" fill="#000000" />
  
  <!-- Outer Window Frame -->
  <rect x="4" y="4" width="968" height="348" fill="#ffffff" stroke="#000000" stroke-width="4" />
  
  <!-- Top Bar -->
  <rect x="4" y="4" width="968" height="42" fill="#c084fc" stroke="#000000" stroke-width="4" />
  <text x="20" y="27" font-family="'Space Mono', 'SF Mono', monospace" font-size="13" font-weight="700" fill="#000000">ENGINE // GREEK VOCATIVE DECLENSION &amp; MULTI-STUDENT PARSER</text>

  <g transform="translate(25, 75)">
    
    <!-- Row 1: Yiannis -->
    <g transform="translate(0, 0)">
      <!-- Column 1: Nominative Box -->
      <g transform="translate(0, 0)">
        <rect x="4" y="4" width="210" height="66" fill="#000000" />
        <rect x="0" y="0" width="210" height="66" fill="#1ac2ff" stroke="#000000" stroke-width="3" />
        <text x="14" y="26" class="box-title">Γιάννης (Nominative)</text>
        <text x="14" y="46" class="box-sub">Official Roster Name</text>
      </g>

      <!-- Arrow Connector 1 -->
      <g transform="translate(222, 18)" class="moving-arrow">
        <text x="0" y="-3" class="arrow-label">getGreekVocative()</text>
        <path d="M 0 15 L 42 15 M 34 7 L 42 15 L 34 23" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Column 2: Spoken Vocative Box -->
      <g transform="translate(280, 0)">
        <rect x="4" y="4" width="210" height="66" fill="#000000" />
        <rect x="0" y="0" width="210" height="66" fill="#facc15" stroke="#000000" stroke-width="3" />
        <text x="14" y="26" class="box-title">"Γιάννη!" (Vocative)</text>
        <text x="14" y="46" class="box-sub">Teacher Spoken Form</text>
      </g>

      <!-- Arrow Connector 2 -->
      <g transform="translate(502, 18)" class="moving-arrow">
        <text x="6" y="-3" class="arrow-label">Match Roster</text>
        <path d="M 0 15 L 42 15 M 34 7 L 42 15 L 34 23" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Column 3: Resolved Target Card -->
      <g transform="translate(560, 0)">
        <rect x="4" y="4" width="385" height="66" fill="#000000" />
        <rect x="0" y="0" width="385" height="66" fill="#4ade80" stroke="#000000" stroke-width="3" />
        <text x="14" y="26" class="box-title">RESOLVED: Yiannis P. (ID #2)</text>
        <text x="14" y="46" class="box-sub">Praise Trigger: "Πολύ ωραία" -&gt; +1 PTS</text>
      </g>
    </g>

    <!-- Row 2: Andreas -->
    <g transform="translate(0, 88)">
      <g transform="translate(0, 0)">
        <rect x="4" y="4" width="210" height="66" fill="#000000" />
        <rect x="0" y="0" width="210" height="66" fill="#1ac2ff" stroke="#000000" stroke-width="3" />
        <text x="14" y="26" class="box-title">Ανδρέας (Nominative)</text>
        <text x="14" y="46" class="box-sub">Official Roster Name</text>
      </g>

      <g transform="translate(222, 18)" class="moving-arrow">
        <text x="0" y="-3" class="arrow-label">getGreekVocative()</text>
        <path d="M 0 15 L 42 15 M 34 7 L 42 15 L 34 23" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <g transform="translate(280, 0)">
        <rect x="4" y="4" width="210" height="66" fill="#000000" />
        <rect x="0" y="0" width="210" height="66" fill="#facc15" stroke="#000000" stroke-width="3" />
        <text x="14" y="26" class="box-title">"Ανδρέα!" (Vocative)</text>
        <text x="14" y="46" class="box-sub">Teacher Spoken Form</text>
      </g>

      <g transform="translate(502, 18)" class="moving-arrow">
        <text x="6" y="-3" class="arrow-label">Match Roster</text>
        <path d="M 0 15 L 42 15 M 34 7 L 42 15 L 34 23" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <g transform="translate(560, 0)">
        <rect x="4" y="4" width="385" height="66" fill="#000000" />
        <rect x="0" y="0" width="385" height="66" fill="#4ade80" stroke="#000000" stroke-width="3" />
        <text x="14" y="26" class="box-title">RESOLVED: Andreas T. (ID #4)</text>
        <text x="14" y="46" class="box-sub">Praise Trigger: "Μπράβο" -&gt; +1 PTS</text>
      </g>
    </g>

    <!-- Row 3: Nikos -->
    <g transform="translate(0, 176)">
      <g transform="translate(0, 0)">
        <rect x="4" y="4" width="210" height="66" fill="#000000" />
        <rect x="0" y="0" width="210" height="66" fill="#1ac2ff" stroke="#000000" stroke-width="3" />
        <text x="14" y="26" class="box-title">Νίκος (Nominative)</text>
        <text x="14" y="46" class="box-sub">Official Roster Name</text>
      </g>

      <g transform="translate(222, 18)" class="moving-arrow">
        <text x="0" y="-3" class="arrow-label">getGreekVocative()</text>
        <path d="M 0 15 L 42 15 M 34 7 L 42 15 L 34 23" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <g transform="translate(280, 0)">
        <rect x="4" y="4" width="210" height="66" fill="#000000" />
        <rect x="0" y="0" width="210" height="66" fill="#facc15" stroke="#000000" stroke-width="3" />
        <text x="14" y="26" class="box-title">"Νίκο!" (Vocative)</text>
        <text x="14" y="46" class="box-sub">Teacher Spoken Form</text>
      </g>

      <g transform="translate(502, 18)" class="moving-arrow">
        <text x="6" y="-3" class="arrow-label">Match Roster</text>
        <path d="M 0 15 L 42 15 M 34 7 L 42 15 L 34 23" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <g transform="translate(560, 0)">
        <rect x="4" y="4" width="385" height="66" fill="#000000" />
        <rect x="0" y="0" width="385" height="66" fill="#ff66a3" stroke="#000000" stroke-width="3" />
        <text x="14" y="26" class="box-title">RESOLVED: Nikos L. (ID #6)</text>
        <text x="14" y="46" class="box-sub">Correction Trigger: "Σταμάτα" -&gt; -1 PTS</text>
      </g>
    </g>

  </g>
</svg>
