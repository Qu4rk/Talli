    <circle cx="16" cy="16" r="4.5" fill="#f43f5e" />
    <circle cx="30" cy="16" r="4.5" fill="#fbbf24" />
    <circle cx="44" cy="16" r="4.5" fill="#22c55e" />
    <text x="64" y="21" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">localhost:3000/classroom // LIVE SESSION</text>

    <!-- Inner Dashboard Container -->
