        <rect x="0" y="0" width="170" height="62" fill="#facc15" stroke="#000000" stroke-width="2.5" />
        <text x="14" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#000000">36 Classes</text>
        <text x="14" y="46" class="card-sub">Grades A'1 through F'6</text>
