<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;family=Space+Mono:wght@700&amp;display=swap');
      
      .brand-sub { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 900; fill: #000000; letter-spacing: -0.3px; }
      .tagline { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 13px; font-weight: 700; fill: #000000; opacity: 0.85; }
      .badge-text { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 11px; font-weight: 700; fill: #000000; }
      .card-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 900; fill: #000000; }
      .card-sub { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 10px; font-weight: 700; fill: #000000; opacity: 0.8; }
      
      /* Equalizer Bar Animations */
      @keyframes eq1 { 0%, 100% { height: 14px; y: 28px; } 50% { height: 38px; y: 4px; } }
      @keyframes eq2 { 0%, 100% { height: 36px; y: 6px; } 50% { height: 16px; y: 26px; } }
      @keyframes eq3 { 0%, 100% { height: 20px; y: 22px; } 50% { height: 42px; y: 0px; } }
      @keyframes eq4 { 0%, 100% { height: 40px; y: 2px; } 50% { height: 18px; y: 24px; } }
      
      .bar-1 { animation: eq1 1.1s ease-in-out infinite; }
      .bar-2 { animation: eq2 0.9s ease-in-out infinite; }
      .bar-3 { animation: eq3 1.3s ease-in-out infinite; }
      .bar-4 { animation: eq4 1.0s ease-in-out infinite; }

      /* Pulse Ring Animation */
      @keyframes pulseRing {
        0% { transform: scale(0.95); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 0.4; }
        100% { transform: scale(0.95); opacity: 0.9; }
      }
      .pulsing-dot { animation: pulseRing 2s infinite ease-in-out; transform-origin: center; }
    </style>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#000000" stroke-width="1" opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="#f8fafc" />
  <rect width="1200" height="520" fill="url(#grid)" />

  <!-- Outer Hard Shadow -->
  <rect x="24" y="24" width="1152" height="472" fill="#000000" />
  
  <!-- Main Window Frame -->
  <rect x="12" y="12" width="1152" height="472" fill="#ffffff" stroke="#000000" stroke-width="4" />
  
  <!-- Window Title Bar -->
  <rect x="12" y="12" width="1152" height="48" fill="#facc15" stroke="#000000" stroke-width="4" />
  
  <!-- Window Control Dots -->
  <circle cx="42" cy="36" r="8" fill="#ff66a3" stroke="#000000" stroke-width="2.5" />
  <circle cx="66" cy="36" r="8" fill="#1ac2ff" stroke="#000000" stroke-width="2.5" />
  <circle cx="90" cy="36" r="8" fill="#4ade80" stroke="#000000" stroke-width="2.5" />
  
  <text x="120" y="41" font-family="'Space Mono', 'SF Mono', monospace" font-size="13" font-weight="700" fill="#000000">TALLI // AMBIENT CLASSROOM INTELLIGENCE ENGINE (CYPRUS PRIMARY EDUCATION)</text>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(920, 22)">
    <rect x="3" y="3" width="220" height="28" fill="#000000" />
    <rect x="0" y="0" width="220" height="28" fill="#4ade80" stroke="#000000" stroke-width="2.5" />
    <circle cx="18" cy="14" r="6" fill="#000000" class="pulsing-dot" />
    <circle cx="18" cy="14" r="4" fill="#ffffff" />
    <text x="34" y="19" font-family="'Space Mono', 'SF Mono', monospace" font-size="11" font-weight="700" fill="#000000">DEEPGRAM STT : LIVE</text>
  </g>

  <!-- LEFT HERO SECTION -->
  <g transform="translate(50, 85)">
    
    <!-- Pure Vector Brand Header Tile (100% Vector Art - GitHub Camo Sanitizer Proof) -->
    <g transform="translate(0, 0)">
      <!-- Neobrutalist Logo Tile Container -->
      <rect x="4" y="4" width="76" height="76" fill="#000000" />
      <rect x="0" y="0" width="76" height="76" fill="#ff66a3" stroke="#000000" stroke-width="3.5" />
      
      <!-- Vector Talli Mic & Wave Logo Icon -->
      <rect x="25" y="14" width="26" height="34" rx="13" fill="#ffffff" stroke="#000000" stroke-width="3" />
      <path d="M 16 30 A 22 22 0 0 0 60 30" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
      <line x1="38" y1="52" x2="38" y2="61" stroke="#000000" stroke-width="4" stroke-linecap="round" />
      <line x1="26" y1="61" x2="50" y2="61" stroke="#000000" stroke-width="4" stroke-linecap="round" />
      <circle cx="49" cy="18" r="5" fill="#facc15" stroke="#000000" stroke-width="2" />
      
      <!-- Brand Title (Pure Vector Path Art) -->
      <g transform="translate(96, 5)">
        <path d="M 0 10 L 42 10 M 21 10 L 21 62" stroke="#000000" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter" />
        <path d="M 52 38 A 12 12 0 1 1 52 62 L 64 62 L 64 36" fill="none" stroke="#000000" stroke-width="10" stroke-linecap="square" />
        <path d="M 78 10 L 78 62" stroke="#000000" stroke-width="10" stroke-linecap="square" />
        <path d="M 94 10 L 94 62" stroke="#000000" stroke-width="10" stroke-linecap="square" />
        <path d="M 110 32 L 110 62" stroke="#000000" stroke-width="10" stroke-linecap="square" />
        <circle cx="110" cy="16" r="6" fill="#000000" />
      </g>
    </g>

