        <rect x="3" y="3" width="438" height="74" fill="#000000" />
        <rect x="0" y="0" width="438" height="74" fill="#1ac2ff" stroke="#000000" stroke-width="2.5" />
        <text x="14" y="24" class="card-title">AUDIO MONITOR // SILERO VAD 4.8s BUFFER</text>
        
        <!-- Animated Equalizer Spectrum -->
        <g transform="translate(14, 34)">
          <rect x="0" y="10" width="10" height="20" fill="#000000" class="bar-1" />
          <rect x="15" y="4" width="10" height="32" fill="#000000" class="bar-2" />
          <rect x="30" y="12" width="10" height="24" fill="#000000" class="bar-3" />
          <rect x="45" y="0" width="10" height="38" fill="#000000" class="bar-4" />
          <rect x="60" y="14" width="10" height="22" fill="#000000" class="bar-1" />
          <rect x="75" y="6" width="10" height="30" fill="#000000" class="bar-2" />
          <rect x="90" y="18" width="10" height="18" fill="#000000" class="bar-3" />
          <rect x="105" y="2" width="10" height="36" fill="#000000" class="bar-4" />
          <rect x="120" y="10" width="10" height="26" fill="#000000" class="bar-1" />
          <rect x="135" y="8" width="10" height="28" fill="#000000" class="bar-2" />
          <rect x="150" y="16" width="10" height="20" fill="#000000" class="bar-3" />
          <rect x="165" y="4" width="10" height="32" fill="#000000" class="bar-4" />
        </g>
        
        <rect x="290" y="34" width="134" height="28" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="302" y="52" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#000000">DEEPGRAM: ACTIVE</text>
      </g>

      <!-- Live Roster Cards (3 Cards) -->
      <!-- Card 1: Eleni M. -->
      <g transform="translate(0, 90)">
        <rect x="3" y="3" width="438" height="66" fill="#000000" />
        <rect x="0" y="0" width="438" height="66" fill="#4ade80" stroke="#000000" stroke-width="2.5" />
        <rect x="12" y="12" width="42" height="42" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#000000">EM</text>
        <text x="66" y="30" class="card-title">Eleni M. (Ελένη Μ.)</text>
        <text x="66" y="48" class="card-sub">Praise: "Μπράβο Ελένη"</text>
        
        <rect x="340" y="14" width="84" height="38" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="354" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#000000">+15 PTS</text>
      </g>

      <!-- Card 2: Yiannis P. -->
      <g transform="translate(0, 166)">
        <rect x="3" y="3" width="438" height="66" fill="#000000" />
        <rect x="0" y="0" width="438" height="66" fill="#facc15" stroke="#000000" stroke-width="2.5" />
        <rect x="12" y="12" width="42" height="42" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="25" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#000000">YP</text>
        <text x="66" y="30" class="card-title">Yiannis P. (Γιάννης Π.)</text>
        <text x="66" y="48" class="card-sub">Praise: "Πολύ ωραία Γιάννη"</text>
        
        <rect x="340" y="14" width="84" height="38" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="358" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#000000">+9 PTS</text>
      </g>

      <!-- Card 3: Nikos L. -->
      <g transform="translate(0, 242)">
        <rect x="3" y="3" width="438" height="66" fill="#000000" />
        <rect x="0" y="0" width="438" height="66" fill="#ff66a3" stroke="#000000" stroke-width="2.5" />
        <rect x="12" y="12" width="42" height="42" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#000000">NL</text>
        <text x="66" y="30" class="card-title">Nikos L. (Νίκος Λ.)</text>
        <text x="66" y="48" class="card-sub">Correction: "Σταμάτα Νίκο"</text>
        
        <rect x="340" y="14" width="84" height="38" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="354" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#000000">+11 PTS</text>
      </g>

