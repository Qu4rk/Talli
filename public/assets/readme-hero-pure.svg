      <rect x="0" y="0" width="550" height="42" fill="#1ac2ff" stroke="#000000" stroke-width="3" />
      <text x="16" y="27" class="brand-sub">AMBIENT GREEK CLASSROOM BEHAVIOR COPILOT</text>
    </g>
    
    <!-- Bullet Value Props -->
    <g transform="translate(0, 162)">
      <text x="0" y="0" class="tagline">• Passive Speech Recognition (Modern Greek el-GR)</text>
      <text x="0" y="22" class="tagline">• Spoken Vocative Declension Engine (Γιάννης → Γιάννη)</text>
      <text x="0" y="44" class="tagline">• Multi-Student Praise &amp; Correction Single-Pass Parsing</text>
    </g>

