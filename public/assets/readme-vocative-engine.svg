<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="100%" height="440">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;family=Space+Mono:wght@700&amp;display=swap');
      
      .title-text { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 13px; font-weight: 700; fill: #000000; }
      .section-label { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 11px; font-weight: 700; fill: #000000; letter-spacing: 0.5px; }
      .code-line { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .box-name { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; font-weight: 900; fill: #000000; }
      .box-detail { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 11px; font-weight: 700; fill: #000000; opacity: 0.85; }

      @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      .pulsing-status { animation: pulseDot 1.4s infinite ease-in-out; }

      @keyframes slideArrow { 0%, 100% { transform: translateX(0px); } 50% { transform: translateX(5px); } }
      .moving-arrow { animation: slideArrow 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Shadow Layer -->
  <rect x="18" y="18" width="1064" height="408" fill="#000000" />
  
  <!-- Outer Window Frame -->
  <rect x="6" y="6" width="1064" height="408" fill="#ffffff" stroke="#000000" stroke-width="4" />
  
  <!-- Window Top Bar -->
  <rect x="6" y="6" width="1064" height="44" fill="#c084fc" stroke="#000000" stroke-width="4" />
  <circle cx="34" cy="28" r="7" fill="#ff66a3" stroke="#000000" stroke-width="2" />
  <circle cx="54" cy="28" r="7" fill="#facc15" stroke="#000000" stroke-width="2" />
  <circle cx="74" cy="28" r="7" fill="#4ade80" stroke="#000000" stroke-width="2" />
  <text x="100" y="33" class="title-text">ENGINE // GREEK VOCATIVE DECLENSION &amp; MULTI-STUDENT PARSER</text>

  <!-- Content Container (3 Panels) -->
  <g transform="translate(26, 68)">
    
    <!-- LEFT PANEL: SPOKEN GREEK AUDIO STREAM INPUT (x: 0, width: 330) -->
    <g transform="translate(0, 0)">
      <rect x="4" y="4" width="330" height="330" fill="#000000" />
      <rect x="0" y="0" width="330" height="330" fill="#1e293b" stroke="#000000" stroke-width="3" />
      
      <!-- Panel Header -->
      <rect x="0" y="0" width="330" height="34" fill="#0f172a" stroke="#000000" stroke-width="3" />
      <circle cx="18" cy="17" r="5" fill="#ef4444" class="pulsing-status" />
      <text x="32" y="22" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">1. SPOKEN AUDIO STREAM</text>

      <!-- Waveform Animation -->
      <g transform="translate(16, 48)">
        <rect x="0" y="8" width="6" height="24" fill="#38bdf8" />
        <rect x="10" y="2" width="6" height="36" fill="#38bdf8" />
        <rect x="20" y="12" width="6" height="16" fill="#38bdf8" />
        <rect x="30" y="0" width="6" height="40" fill="#38bdf8" />
        <rect x="40" y="6" width="6" height="28" fill="#38bdf8" />
        <rect x="50" y="16" width="6" height="8" fill="#38bdf8" />
        <rect x="60" y="4" width="6" height="32" fill="#38bdf8" />
        <text x="80" y="24" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">el-GR // 16kHz VAD</text>
      </g>

      <!-- Spoken Dialogue Console Box -->
      <g transform="translate(16, 105)">
        <rect x="0" y="0" width="298" height="195" fill="#090d16" stroke="#334155" stroke-width="2" />
        <text x="12" y="26" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#64748b">// Teacher Spoken Phrase:</text>
        
        <text x="12" y="58" class="code-line" fill="#facc15">"Μπράβο Ελένη,</text>
        <text x="12" y="84" class="code-line" fill="#facc15"> πολύ ωραία Γιάννη,</text>
        <text x="12" y="110" class="code-line" fill="#facc15"> και Νίκο σταμάτα!"</text>
        
        <line x1="12" y1="130" x2="286" y2="130" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" />
        
        <text x="12" y="154" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#4ade80">✓ VAD Speech End (4.8s)</text>
        <text x="12" y="174" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">✓ Confidence: 99.1%</text>
      </g>
    </g>

    <!-- CENTER PANEL: MORPHOLOGICAL PARSER & DECLENSION (x: 350, width: 360) -->
    <g transform="translate(350, 0)">
      <rect x="4" y="4" width="360" height="330" fill="#000000" />
      <rect x="0" y="0" width="360" height="330" fill="#ffffff" stroke="#000000" stroke-width="3" />
      
      <!-- Panel Header -->
      <rect x="0" y="0" width="360" height="34" fill="#facc15" stroke="#000000" stroke-width="3" />
      <text x="16" y="22" class="section-label">2. VOCATIVE DECLENSION ENGINE</text>

      <!-- Row 1: Eleni (Feminine) -->
      <g transform="translate(16, 48)">
        <rect x="3" y="3" width="328" height="76" fill="#000000" />
        <rect x="0" y="0" width="328" height="76" fill="#1ac2ff" stroke="#000000" stroke-width="2.5" />
        <text x="14" y="26" class="box-name">"Ελένη" (Spoken Vocative)</text>
        <text x="14" y="46" class="box-detail">Declension: Unchanged (Fem. Nom=Voc)</text>
        <rect x="14" y="52" width="130" height="18" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="20" y="65" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#000000">➔ Roster: Ελένη Μ.</text>
      </g>

      <!-- Row 2: Yiannis (Masculine -is -> -i) -->
      <g transform="translate(16, 136)">
        <rect x="3" y="3" width="328" height="76" fill="#000000" />
        <rect x="0" y="0" width="328" height="76" fill="#facc15" stroke="#000000" stroke-width="2.5" />
        <text x="14" y="26" class="box-name">"Γιάννη" ➔ Γιάννης</text>
        <text x="14" y="46" class="box-detail">Rule: -ης (Nominative) ➔ -η (Vocative)</text>
        <rect x="14" y="52" width="130" height="18" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="20" y="65" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#000000">➔ Roster: Γιάννης Π.</text>
      </g>

      <!-- Row 3: Nikos (Masculine -os -> -o) -->
      <g transform="translate(16, 224)">
        <rect x="3" y="3" width="328" height="76" fill="#000000" />
        <rect x="0" y="0" width="328" height="76" fill="#ff66a3" stroke="#000000" stroke-width="2.5" />
        <text x="14" y="26" class="box-name">"Νίκο" ➔ Νίκος</text>
        <text x="14" y="46" class="box-detail">Rule: -ος (Nominative) ➔ -ο (Vocative)</text>
        <rect x="14" y="52" width="130" height="18" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="20" y="65" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#000000">➔ Roster: Νίκος Λ.</text>
      </g>

    </g>

    <!-- RIGHT PANEL: DISPATCHED MERIT ACTIONS (x: 730, width: 280) -->
    <g transform="translate(730, 0)">
      <rect x="4" y="4" width="280" height="330" fill="#000000" />
      <rect x="0" y="0" width="280" height="330" fill="#ffffff" stroke="#000000" stroke-width="3" />
      
      <!-- Panel Header -->
      <rect x="0" y="0" width="280" height="34" fill="#4ade80" stroke="#000000" stroke-width="3" />
      <text x="16" y="22" class="section-label">3. POINT DISPATCH</text>

      <!-- Action Card 1: Eleni M. +1 PTS -->
      <g transform="translate(14, 48)">
        <rect x="3" y="3" width="252" height="76" fill="#000000" />
        <rect x="0" y="0" width="252" height="76" fill="#4ade80" stroke="#000000" stroke-width="2.5" />
        <text x="12" y="26" class="box-name">Eleni M. (ID #1)</text>
        <text x="12" y="46" class="box-detail">Praise: "Μπράβο"</text>
        <rect x="170" y="14" width="70" height="46" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="178" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#000000">+1 PTS</text>
      </g>

      <!-- Action Card 2: Yiannis P. +1 PTS -->
      <g transform="translate(14, 136)">
        <rect x="3" y="3" width="252" height="76" fill="#000000" />
        <rect x="0" y="0" width="252" height="76" fill="#4ade80" stroke="#000000" stroke-width="2.5" />
        <text x="12" y="26" class="box-name">Yiannis P. (ID #2)</text>
        <text x="12" y="46" class="box-detail">Praise: "Πολύ ωραία"</text>
        <rect x="170" y="14" width="70" height="46" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="178" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#000000">+1 PTS</text>
      </g>

      <!-- Action Card 3: Nikos L. -1 PTS -->
      <g transform="translate(14, 224)">
        <rect x="3" y="3" width="252" height="76" fill="#000000" />
        <rect x="0" y="0" width="252" height="76" fill="#ff66a3" stroke="#000000" stroke-width="2.5" />
        <text x="12" y="26" class="box-name">Nikos L. (ID #6)</text>
        <text x="12" y="46" class="box-detail">Correction: "Σταμάτα"</text>
        <rect x="170" y="14" width="70" height="46" fill="#ffffff" stroke="#000000" stroke-width="2" />
        <text x="180" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#000000">-1 PTS</text>
      </g>

    </g>

  </g>
</svg>
