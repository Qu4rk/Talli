<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;display=swap');
      
      .terminal-text { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .green { fill: #4ade80; }
      .blue { fill: #1ac2ff; }
      .pink { fill: #ff66a3; }
      .yellow { fill: #facc15; }
      .gray { fill: #94a3b8; }
      
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes type1 { 0% { opacity: 0; } 10% { opacity: 1; } }
      @keyframes type2 { 0%, 20% { opacity: 0; } 30% { opacity: 1; } }
      @keyframes type3 { 0%, 50% { opacity: 0; } 60% { opacity: 1; } }
      @keyframes type4 { 0%, 75% { opacity: 0; } 85% { opacity: 1; } }
      
      .cursor { animation: blink 0.8s infinite; }
      .line-1 { animation: type1 8s infinite; }
      .line-2 { animation: type2 8s infinite; }
      .line-3 { animation: type3 8s infinite; }
      .line-4 { animation: type4 8s infinite; }
    </style>
  </defs>

  <!-- Shadow -->
  <rect x="12" y="12" width="776" height="216" fill="#000000" />
  
  <!-- Terminal Frame -->
  <rect x="4" y="4" width="776" height="216" fill="#0f172a" stroke="#000000" stroke-width="3" />
  
  <!-- Terminal Top Bar -->
  <rect x="4" y="4" width="776" height="34" fill="#1e293b" stroke="#000000" stroke-width="3" />
  <circle cx="24" cy="21" r="5" fill="#ef4444" stroke="#000000" stroke-width="1.5" />
  <circle cx="40" cy="21" r="5" fill="#eab308" stroke="#000000" stroke-width="1.5" />
  <circle cx="56" cy="21" r="5" fill="#22c55e" stroke="#000000" stroke-width="1.5" />
  
  <text x="76" y="25" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8">talli-stt-engine --live --language=el-GR</text>
  
  <!-- Terminal Content Lines -->
  <g transform="translate(24, 62)">
    <!-- Line 1: VAD Buffer -->
    <g class="line-1">
      <text x="0" y="0" class="terminal-text gray">[04:42:01]</text>
      <text x="90" y="0" class="terminal-text blue">AUDIO_VAD_BUFFER</text>
      <text x="240" y="0" class="terminal-text">Sliced 4.8s PCM audio chunk (Silero VAD = 0.88)</text>
    </g>
    
    <!-- Line 2: STT Transcript -->
    <g class="line-2" transform="translate(0, 32)">
      <text x="0" y="0" class="terminal-text gray">[04:42:01]</text>
      <text x="90" y="0" class="terminal-text yellow">DEEPGRAM_STT</text>
      <text x="240" y="0" class="terminal-text pink">&quot;Μπράβο Ελένη, πολύ ωραία Γιάννη!&quot;</text>
    </g>

    <!-- Line 3: Structured Parse -->
    <g class="line-3" transform="translate(0, 64)">
      <text x="0" y="0" class="terminal-text gray">[04:42:02]</text>
      <text x="90" y="0" class="terminal-text green">VOCATIVE_PARSER</text>
      <text x="240" y="0" class="terminal-text">Matched 2 Students:</text>
      <text x="400" y="0" class="terminal-text green">Eleni M. (+1 PTS)</text>
      <text x="560" y="0" class="terminal-text green">Yiannis P. (+1 PTS)</text>
    </g>

    <!-- Line 4: Action Result -->
    <g class="line-4" transform="translate(0, 96)">
      <text x="0" y="0" class="terminal-text gray">[04:42:02]</text>
      <text x="90" y="0" class="terminal-text pink">SYSTEM_EVENT</text>
      <text x="240" y="0" class="terminal-text">Confetti triggered • Latency: 210ms • Score synchronized</text>
      <rect x="715" y="-12" width="8" height="15" fill="#4ade80" class="cursor" />
    </g>
  </g>
</svg>
