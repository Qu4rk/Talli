<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;family=Space+Mono:wght@700&amp;display=swap');
      
      .col-header { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 11px; font-weight: 700; fill: #000000; letter-spacing: 0.5px; }
      .box-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 900; fill: #000000; }
      .box-sub { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 10px; font-weight: 700; fill: #000000; opacity: 0.85; }

      @keyframes slideArrow {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(4px); }
      }
      .animated-arrow { animation: slideArrow 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Shadow Layer -->
  <rect x="16" y="16" width="968" height="348" fill="#000000" />
  
  <!-- Outer Window Frame -->
  <rect x="4" y="4" width="968" height="348" fill="#ffffff" stroke="#000000" stroke-width="4" />
  
  <!-- Top Bar -->
  <rect x="4" y="4" width="968" height="42" fill="#c084fc" stroke="#000000" stroke-width="4" />
  <text x="20" y="27" font-family="'Space Mono', 'SF Mono', monospace" font-size="13" font-weight="700" fill="#000000">ENGINE // GREEK VOCATIVE DECLENSION &amp; MULTI-STUDENT PARSER</text>

  <g transform="translate(35, 65)">
    
    <!-- Symmetrical Column Headers Row (250px each) -->
    <g transform="translate(0, 0)">
      <!-- Col 1 Header (x: 0, width: 250) -->
      <rect x="3" y="3" width="250" height="26" fill="#000000" />
      <rect x="0" y="0" width="250" height="26" fill="#1ac2ff" stroke="#000000" stroke-width="2.5" />
      <text x="125" y="17" class="col-header" text-anchor="middle">1. ROSTER (NOMINATIVE)</text>

      <!-- Col 2 Header (x: 340, width: 250) -->
      <rect x="343" y="3" width="250" height="26" fill="#000000" />
      <rect x="340" y="0" width="250" height="26" fill="#facc15" stroke="#000000" stroke-width="2.5" />
      <text x="465" y="17" class="col-header" text-anchor="middle">2. SPOKEN (VOCATIVE)</text>

      <!-- Col 3 Header (x: 680, width: 250) -->
      <rect x="683" y="3" width="250" height="26" fill="#000000" />
      <rect x="680" y="0" width="250" height="26" fill="#4ade80" stroke="#000000" stroke-width="2.5" />
      <text x="805" y="17" class="col-header" text-anchor="middle">3. DISPATCH ACTION</text>
    </g>

    <!-- Content Rows Area -->
    <g transform="translate(0, 42)">
      
      <!-- ROW 1: Yiannis -->
      <g transform="translate(0, 0)">
        <!-- Col 1 Card (x: 0, width: 250) -->
        <g transform="translate(0, 0)">
          <rect x="4" y="4" width="250" height="66" fill="#000000" />
          <rect x="0" y="0" width="250" height="66" fill="#1ac2ff" stroke="#000000" stroke-width="3" />
          <text x="14" y="27" class="box-title">Γιάννης</text>
          <text x="14" y="48" class="box-sub">Official Roster Record #2</text>
        </g>

        <!-- Connector 1 (x: 250 to 340, center line at x: 295) -->
        <g transform="translate(250, 0)">
          <line x1="10" y1="33" x2="80" y2="33" stroke="#000000" stroke-width="3" />
          <g transform="translate(27, 15)" class="animated-arrow">
            <rect x="0" y="0" width="36" height="36" fill="#000000" stroke="#000000" stroke-width="2" />
            <path d="M 10 18 L 26 18 M 18 10 L 26 18 L 18 26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </g>

        <!-- Col 2 Card (x: 340, width: 250) -->
        <g transform="translate(340, 0)">
          <rect x="4" y="4" width="250" height="66" fill="#000000" />
          <rect x="0" y="0" width="250" height="66" fill="#facc15" stroke="#000000" stroke-width="3" />
          <text x="14" y="27" class="box-title">"Γιάννη!"</text>
          <text x="14" y="48" class="box-sub">Spoken Greek Dialogue</text>
        </g>

        <!-- Connector 2 (x: 590 to 680, center line at x: 635) -->
        <g transform="translate(590, 0)">
          <line x1="10" y1="33" x2="80" y2="33" stroke="#000000" stroke-width="3" />
          <g transform="translate(27, 15)" class="animated-arrow">
            <rect x="0" y="0" width="36" height="36" fill="#000000" stroke="#000000" stroke-width="2" />
            <path d="M 10 18 L 26 18 M 18 10 L 26 18 L 18 26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </g>

        <!-- Col 3 Card (x: 680, width: 250) -->
        <g transform="translate(680, 0)">
          <rect x="4" y="4" width="250" height="66" fill="#000000" />
          <rect x="0" y="0" width="250" height="66" fill="#4ade80" stroke="#000000" stroke-width="3" />
          <text x="14" y="27" class="box-title">Yiannis P. (+1 PTS)</text>
          <text x="14" y="48" class="box-sub">Trigger: "Πολύ ωραία"</text>
        </g>
      </g>

      <!-- ROW 2: Andreas -->
      <g transform="translate(0, 86)">
        <!-- Col 1 Card -->
        <g transform="translate(0, 0)">
          <rect x="4" y="4" width="250" height="66" fill="#000000" />
          <rect x="0" y="0" width="250" height="66" fill="#1ac2ff" stroke="#000000" stroke-width="3" />
          <text x="14" y="27" class="box-title">Ανδρέας</text>
          <text x="14" y="48" class="box-sub">Official Roster Record #4</text>
        </g>

        <!-- Connector 1 -->
        <g transform="translate(250, 0)">
          <line x1="10" y1="33" x2="80" y2="33" stroke="#000000" stroke-width="3" />
          <g transform="translate(27, 15)" class="animated-arrow">
            <rect x="0" y="0" width="36" height="36" fill="#000000" stroke="#000000" stroke-width="2" />
            <path d="M 10 18 L 26 18 M 18 10 L 26 18 L 18 26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </g>

        <!-- Col 2 Card -->
        <g transform="translate(340, 0)">
          <rect x="4" y="4" width="250" height="66" fill="#000000" />
          <rect x="0" y="0" width="250" height="66" fill="#facc15" stroke="#000000" stroke-width="3" />
          <text x="14" y="27" class="box-title">"Ανδρέα!"</text>
          <text x="14" y="48" class="box-sub">Spoken Greek Dialogue</text>
        </g>

        <!-- Connector 2 -->
        <g transform="translate(590, 0)">
          <line x1="10" y1="33" x2="80" y2="33" stroke="#000000" stroke-width="3" />
          <g transform="translate(27, 15)" class="animated-arrow">
            <rect x="0" y="0" width="36" height="36" fill="#000000" stroke="#000000" stroke-width="2" />
            <path d="M 10 18 L 26 18 M 18 10 L 26 18 L 18 26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </g>

        <!-- Col 3 Card -->
        <g transform="translate(680, 0)">
          <rect x="4" y="4" width="250" height="66" fill="#000000" />
          <rect x="0" y="0" width="250" height="66" fill="#4ade80" stroke="#000000" stroke-width="3" />
          <text x="14" y="27" class="box-title">Andreas T. (+1 PTS)</text>
          <text x="14" y="48" class="box-sub">Trigger: "Μπράβο"</text>
        </g>
      </g>

      <!-- ROW 3: Nikos -->
      <g transform="translate(0, 172)">
        <!-- Col 1 Card -->
        <g transform="translate(0, 0)">
          <rect x="4" y="4" width="250" height="66" fill="#000000" />
          <rect x="0" y="0" width="250" height="66" fill="#1ac2ff" stroke="#000000" stroke-width="3" />
          <text x="14" y="27" class="box-title">Νίκος</text>
          <text x="14" y="48" class="box-sub">Official Roster Record #6</text>
        </g>

        <!-- Connector 1 -->
        <g transform="translate(250, 0)">
          <line x1="10" y1="33" x2="80" y2="33" stroke="#000000" stroke-width="3" />
          <g transform="translate(27, 15)" class="animated-arrow">
            <rect x="0" y="0" width="36" height="36" fill="#000000" stroke="#000000" stroke-width="2" />
            <path d="M 10 18 L 26 18 M 18 10 L 26 18 L 18 26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </g>

        <!-- Col 2 Card -->
        <g transform="translate(340, 0)">
          <rect x="4" y="4" width="250" height="66" fill="#000000" />
          <rect x="0" y="0" width="250" height="66" fill="#facc15" stroke="#000000" stroke-width="3" />
          <text x="14" y="27" class="box-title">"Νίκο!"</text>
          <text x="14" y="48" class="box-sub">Spoken Greek Dialogue</text>
        </g>

        <!-- Connector 2 -->
        <g transform="translate(590, 0)">
          <line x1="10" y1="33" x2="80" y2="33" stroke="#000000" stroke-width="3" />
          <g transform="translate(27, 15)" class="animated-arrow">
            <rect x="0" y="0" width="36" height="36" fill="#000000" stroke="#000000" stroke-width="2" />
            <path d="M 10 18 L 26 18 M 18 10 L 26 18 L 18 26" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </g>

        <!-- Col 3 Card -->
        <g transform="translate(680, 0)">
          <rect x="4" y="4" width="250" height="66" fill="#000000" />
          <rect x="0" y="0" width="250" height="66" fill="#ff66a3" stroke="#000000" stroke-width="3" />
          <text x="14" y="27" class="box-title">Nikos L. (-1 PTS)</text>
          <text x="14" y="48" class="box-sub">Correction: "Σταμάτα"</text>
        </g>
      </g>

    </g>
  </g>
</svg>
