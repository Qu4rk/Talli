<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;family=Space+Mono:wght@700&amp;display=swap');
      
      .node-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 900; fill: #000000; }
      .node-sub { font-family: 'Space Mono', 'SF Mono', monospace; font-size: 10px; font-weight: 700; fill: #000000; opacity: 0.85; }
      
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      
      .flow-line {
        stroke: #000000; stroke-width: 3; stroke-dasharray: 8 6; animation: dash 1.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Shadow Layer -->
  <rect x="12" y="12" width="776" height="216" fill="#000000" />
  
  <!-- Outer Window Frame -->
  <rect x="4" y="4" width="776" height="216" fill="#ffffff" stroke="#000000" stroke-width="3" />
  
  <!-- Top Bar -->
  <rect x="4" y="4" width="776" height="34" fill="#facc15" stroke="#000000" stroke-width="3" />
  <text x="16" y="24" font-family="'Space Mono', 'SF Mono', monospace" font-size="11" font-weight="700" fill="#000000">SYSTEM ARCHITECTURE // END-TO-END PIPELINE</text>

  <!-- Connecting Animated Lines -->
  <line x1="160" y1="125" x2="200" y2="125" class="flow-line" />
  <line x1="310" y1="125" x2="350" y2="125" class="flow-line" />
  <line x1="460" y1="125" x2="500" y2="125" class="flow-line" />
  <line x1="610" y1="125" x2="650" y2="125" class="flow-line" />

  <!-- Node 1: Voice Input -->
  <g transform="translate(30, 75)">
    <rect x="6" y="6" width="130" height="100" fill="#000000" />
    <rect x="0" y="0" width="130" height="100" fill="#ff66a3" stroke="#000000" stroke-width="3" />
    <text x="14" y="36" class="node-title">Teacher Speech</text>
    <text x="14" y="58" class="node-sub">Natural Dialogue</text>
    <text x="14" y="74" class="node-sub">Greek Classroom</text>
  </g>

  <!-- Node 2: Silero VAD -->
  <g transform="translate(180, 75)">
    <rect x="6" y="6" width="130" height="100" fill="#000000" />
    <rect x="0" y="0" width="130" height="100" fill="#1ac2ff" stroke="#000000" stroke-width="3" />
    <text x="14" y="36" class="node-title">Silero VAD</text>
    <text x="14" y="58" class="node-sub">ONNX WebAssembly</text>
    <text x="14" y="74" class="node-sub">4.8s Audio Buffer</text>
  </g>

  <!-- Node 3: Deepgram STT -->
  <g transform="translate(330, 75)">
    <rect x="6" y="6" width="130" height="100" fill="#000000" />
    <rect x="0" y="0" width="130" height="100" fill="#facc15" stroke="#000000" stroke-width="3" />
    <text x="14" y="36" class="node-title">Deepgram STT</text>
    <text x="14" y="58" class="node-sub">Nova-2 el-GR Model</text>
    <text x="14" y="74" class="node-sub">Continuous Stream</text>
  </g>

  <!-- Node 4: Vocative Engine -->
  <g transform="translate(480, 75)">
    <rect x="6" y="6" width="130" height="100" fill="#000000" />
    <rect x="0" y="0" width="130" height="100" fill="#c084fc" stroke="#000000" stroke-width="3" />
    <text x="14" y="36" class="node-title">Vocative Parser</text>
    <text x="14" y="58" class="node-sub">Greek Declension</text>
    <text x="14" y="74" class="node-sub">Multi-Student Pass</text>
  </g>

  <!-- Node 5: Event / Review -->
  <g transform="translate(630, 75)">
    <rect x="6" y="6" width="130" height="100" fill="#000000" />
    <rect x="0" y="0" width="130" height="100" fill="#4ade80" stroke="#000000" stroke-width="3" />
    <text x="14" y="36" class="node-title">Point Event</text>
    <text x="14" y="58" class="node-sub">Confetti / Roster</text>
    <text x="14" y="74" class="node-sub">End-Session Review</text>
  </g>
</svg>
