<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;family=Space+Mono:wght@700&amp;display=swap');
      
      .title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; fill: #000000; font-size: 42px; letter-spacing: -1.5px; }
      .sub { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; fill: #000000; font-size: 15px; letter-spacing: -0.2px; }
      .mono { font-family: 'Space Mono', monospace; font-weight: 700; fill: #000000; font-size: 11px; }
      
      @keyframes eq1 { 0%, 100% { height: 12px; } 50% { height: 32px; } }
      @keyframes eq2 { 0%, 100% { height: 28px; } 50% { height: 10px; } }
      @keyframes eq3 { 0%, 100% { height: 18px; } 50% { height: 38px; } }
      @keyframes eq4 { 0%, 100% { height: 36px; } 50% { height: 14px; } }
      @keyframes eq5 { 0%, 100% { height: 14px; } 50% { height: 30px; } }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
      
      .bar1 { animation: eq1 1.2s ease-in-out infinite; }
      .bar2 { animation: eq2 0.9s ease-in-out infinite; }
      .bar3 { animation: eq3 1.4s ease-in-out infinite; }
      .bar4 { animation: eq4 1.1s ease-in-out infinite; }
      .bar5 { animation: eq5 1.3s ease-in-out infinite; }
      .live-dot { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Drop Shadow Layer -->
  <rect x="12" y="12" width="776" height="216" rx="0" fill="#000000" />
  
  <!-- Outer Window Frame -->
  <rect x="4" y="4" width="776" height="216" rx="0" fill="#ffffff" stroke="#000000" stroke-width="3" />
  
  <!-- Top Window Header Bar -->
  <rect x="4" y="4" width="776" height="40" fill="#ff66a3" stroke="#000000" stroke-width="3" />
  
  <!-- Window Control Buttons -->
  <circle cx="26" cy="24" r="6" fill="#ef4444" stroke="#000000" stroke-width="2" />
  <circle cx="44" cy="24" r="6" fill="#eab308" stroke="#000000" stroke-width="2" />
  <circle cx="62" cy="24" r="6" fill="#22c55e" stroke="#000000" stroke-width="2" />
  
  <text x="82" y="28" class="mono" fill="#000000">TALLI // AMBIENT CLASSROOM INTELLIGENCE v2.4</text>
  
  <!-- Status Badge -->
  <g transform="translate(615, 12)">
    <rect x="0" y="0" width="150" height="24" fill="#4ade80" stroke="#000000" stroke-width="2" />
    <circle cx="16" cy="12" r="4" fill="#000000" class="live-dot" />
    <text x="28" y="16" class="mono" font-size="10">AI VAD ACTIVE</text>
  </g>
  
  <!-- Main Banner Content -->
  <!-- Audio Equalizer Visualizer Block -->
  <g transform="translate(44, 76)">
    <rect x="0" y="0" width="72" height="72" fill="#1ac2ff" stroke="#000000" stroke-width="3" />
    <!-- Equalizer Bars -->
    <rect class="bar1" x="12" y="20" width="6" height="24" fill="#000000" />
    <rect class="bar2" x="22" y="15" width="6" height="30" fill="#000000" />
    <rect class="bar3" x="32" y="10" width="6" height="40" fill="#000000" />
    <rect class="bar4" x="42" y="18" width="6" height="28" fill="#000000" />
    <rect class="bar5" x="52" y="24" width="6" height="20" fill="#000000" />
  </g>
  
  <!-- Main Titles -->
  <text x="136" y="112" class="title">Talli</text>
  <text x="235" y="112" class="sub" font-size="28" font-weight="900" fill="#ff66a3">.ai</text>
  
  <text x="136" y="138" class="sub">Continuous Greek Speech Recognition &amp; Automated Classroom Analytics</text>
  
  <!-- Tags Bar -->
  <g transform="translate(136, 156)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="130" height="24" fill="#facc15" stroke="#000000" stroke-width="2" />
    <text x="10" y="16" class="mono" font-size="10">CYPRUS PRIMARY</text>
    
    <!-- Tag 2 -->
    <rect x="140" y="0" width="125" height="24" fill="#c084fc" stroke="#000000" stroke-width="2" />
    <text x="150" y="16" class="mono" font-size="10">GREEK VOCATIVE</text>
    
    <!-- Tag 3 -->
    <rect x="275" y="0" width="120" height="24" fill="#4ade80" stroke="#000000" stroke-width="2" />
    <text x="285" y="16" class="mono" font-size="10">DEEPGRAM STT</text>
    
    <!-- Tag 4 -->
    <rect x="405" y="0" width="115" height="24" fill="#1ac2ff" stroke="#000000" stroke-width="2" />
    <text x="415" y="16" class="mono" font-size="10">SILERO VAD</text>
  </g>
</svg>
